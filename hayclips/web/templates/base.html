<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HayClips{% endblock %} · HayClips</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <a class="brand" href="/">HayClips</a>
  {% if row is defined and row %}
  <nav>
    <a href="/p/{{ row.id }}">Project</a>
    <a href="/p/{{ row.id }}/candidates">Candidates</a>
    <a href="/p/{{ row.id }}/transcribe">Transcription</a>
    <a href="/p/{{ row.id }}/review">Review</a>
    <a href="/p/{{ row.id }}/summary">Summary</a>
  </nav>
  {% endif %}
  <span class="muted">local operator tool · nothing is published or sent to creators</span>
</header>
<main>
{% if msg %}<div class="flash" role="status">{{ msg }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
